server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The router uses createWebHistory (HTML5 history mode), so any deep
    # link (/games/new, /facilities/onboard, ...) is a real URL the server
    # has no file for. Fall back to index.html and let vue-router resolve
    # it client-side; without this, a refresh on any route but "/" 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # #339. Everything under /v1 is the gRPC-gateway REST API, proxied to the
    # `app` service so the browser sees ONE origin.
    #
    # Without this, `make up` produced a rendered app that could not reach its
    # own backend: the bundle was built with VITE_API_BASE_URL pointing at
    # :8080 while nginx served it on :5173, so every call was cross-origin,
    # and the Go server sends no Access-Control-Allow-Origin. Chromium blocked
    # the lot. Nobody noticed for 66 sprints because the 724 web tests mount a
    # fixture client and no gate opens a browser.
    #
    # `app` is the compose service name; this file is only ever used inside
    # that network (web/Dockerfile copies it into the nginx image).
    # `resolver` + a variable, rather than a literal `proxy_pass http://app:8080`.
    #
    # nginx resolves an upstream named LITERALLY at config-parse time, so if
    # the API container is not running when nginx starts, nginx refuses to
    # boot at all:
    #
    #   nginx: [emerg] host not found in upstream "app" in …/default.conf
    #
    # That turns "the API is down" into "the whole site is down", including
    # the static pages that need no API — observed 2026-10-17 when the API
    # exited on a first run and took the web container with it. Assigning
    # the upstream to a variable defers resolution to request time, so nginx
    # serves the app and only the /v1 calls fail until the API is back.
    #
    # 127.0.0.11 is Docker's embedded DNS, which resolves compose service
    # names.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /v1/ {
        set $upstream_api http://app:8080;
        proxy_pass $upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-streaming RPCs reach the gateway as chunked responses;
        # buffering them would hold the whole stream before the first byte.
        proxy_buffering off;
    }

    # Vite emits content-hashed asset filenames, so they are safe to cache
    # indefinitely. index.html must NOT be cached, or a returning browser
    # keeps loading the old bundle's asset URLs after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
