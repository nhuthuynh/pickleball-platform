# golangci-lint configuration.
#
# Exists for CI/local parity (SCRUM-6): without a checked-in config,
# `golangci-lint run ./...` lints whatever the locally-installed version
# happens to default to, so a developer and the Jenkins agent can get
# different answers from the same command. Pinning the enabled set makes
# `make lint` mean one thing everywhere.
#
# The enabled set is deliberately golangci-lint's own default set, stated
# explicitly rather than implied. Widening it (revive, gosec, errorlint,
# ...) is a worthwhile follow-up but is NOT part of this ticket: turning on
# new linters across a five-context codebase would bury a pipeline change
# under unrelated code churn.
version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  exclusions:
    # golangci-lint's own "sane defaults" preset, which (among other
    # things) relaxes errcheck inside tests.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

    rules:
      # SA1019 (use of a deprecated identifier) in _test.go ONLY.
      #
      # The proto request fields these tests set — ActorPlayerId,
      # ActorUserId, PlayerId, AssignedGameAdminUserIds — were deprecated
      # when the server started deriving the actor from the bearer token
      # instead of trusting the request body (#144 / T55.1). The tests that
      # pin that behaviour have to set the deprecated field: their whole
      # point is that a client claiming "I am this player" is ignored. The
      # call sites are commented `// the lie`.
      #
      # Production code is NOT excluded, and today triggers SA1019 nowhere:
      # all 40 findings are in _test.go (counted, not assumed —
      # `golangci-lint run ./... | grep SA1019` by file). If a non-test file
      # ever reaches for a deprecated API, this rule leaves it failing.
      #
      # Needed from golangci-lint v2.15.0 (2026-10-18). v2.5.0's staticcheck
      # did not report these; the repo had to move off v2.5.0 because it
      # refuses a module targeting Go 1.26, which the Go toolchain bump for
      # four called net/http advisories made necessary. See
      # tools/versions.env.
      - path: _test\.go
        linters:
          - staticcheck
        text: SA1019

issues:
  # Report every occurrence, not just the first few per linter/file —
  # a CI gate that hides findings behind "N more issues" is a gate you
  # cannot act on from the build log alone.
  max-issues-per-linter: 0
  max-same-issues: 0
