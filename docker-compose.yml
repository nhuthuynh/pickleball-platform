services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: pickleball
      POSTGRES_PASSWORD: pickleball
      POSTGRES_DB: pickleball
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied in filename order, once, only on a fresh volume — see the
      # CLAUDE.md gotcha (make down drops the volume, then make up reapplies).
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickleball"]
      interval: 2s
      timeout: 2s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://pickleball:pickleball@db:5432/pickleball?sslmode=disable
      GRPC_ADDR: ":8081"
      HTTP_ADDR: ":8080"

      # --- Local-development authentication (T14.9, issue #160) -----------
      #
      # Since T13.5 this binary REFUSES TO START without all three of these:
      # it declares 24 authenticated RPCs across six contexts, and a process
      # that demands tokens it cannot verify must not run. That is correct,
      # and it is what broke `make up` — the values below are what fix it.
      #
      # They point at a keypair COMMITTED TO THIS REPOSITORY (dev/auth/),
      # which makes it public, which makes it worthless. That is the whole
      # design: a real verifier verifying real signatures, so local
      # development exercises the same code path a deployment does, rather
      # than a bypass of it. Read dev/auth/README.md before copying any of
      # this anywhere — a deployment sets these three to a real identity
      # provider's issuer, audience and JWKS, and NEVER mounts dev/auth.
      #
      # `.invalid` is reserved by RFC 2606 and can never resolve, so neither
      # of these strings can collide with a real provider's URLs.
      #
      # Mint a token for these values with:  make dev-token
      AUTH_ISSUER: https://dev-auth.pickleball.invalid/
      AUTH_AUDIENCE: https://api.pickleball.invalid/dev
      AUTH_JWKS_FILE: /etc/pickleball/dev-auth/dev-only-insecure.jwks.json
    volumes:
      # Bind-mounted read-only rather than COPYd in the Dockerfile, so the
      # image this compose file builds is byte-identical to the one a
      # deployment builds and carries no dev key material at all. A server
      # started from that image without this mount fails exactly as T13.5
      # made it fail.
      - ./dev/auth:/etc/pickleball/dev-auth:ro
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  # The Vue client, built to static assets and served by nginx (SCRUM-6),
  # so `make up` brings up the whole stack rather than backend-only.
  #
  # Note the browser calls the API directly on localhost:8080 (the origin
  # baked in at build time by VITE_API_BASE_URL) rather than being proxied
  # through this nginx — the API is already published to the host, and
  # adding a proxy hop would mean the dev stack and production disagreed
  # about where the API lives.
  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      # Ordering only: nginx serves a static bundle, so it does not need the
      # API to be healthy to start — but starting it after the API keeps the
      # first page load from racing an API that is not listening yet.
      - app

volumes:
  pgdata:
