version: "2"
sql:
  # Booking context (bookings + pricing_rules). Queries are listed
  # explicitly (not the whole db/queries dir) so adding a new bounded
  # context's .sql file under db/queries doesn't silently get swept into
  # this package too — see the payments and socialplay entries below.
  - engine: "postgresql"
    queries:
      - "db/queries/booking.sql"
      - "db/queries/pricing.sql"
    schema: "db/migrations"
    gen:
      go:
        package: "bookingdb"
        out: "internal/gen/bookingdb"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
  # Payments context (payments table), T6.4. Its own generated package
  # (paymentsdb) mirrors bookingdb's shape but stays a separate Go package,
  # keeping the context boundary visible in generated code too.
  - engine: "postgresql"
    queries:
      - "db/queries/payments.sql"
    schema: "db/migrations"
    gen:
      go:
        package: "paymentsdb"
        out: "internal/gen/paymentsdb"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
  # Social Play context (games + registrations), T5.4. Its own generated
  # package (socialplaydb) mirrors bookingdb's shape but stays a separate
  # Go package, keeping the context boundary visible in generated code too.
  - engine: "postgresql"
    queries:
      - "db/queries/socialplay.sql"
    schema: "db/migrations"
    gen:
      go:
        package: "socialplaydb"
        out: "internal/gen/socialplaydb"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
  # Facilities context (facilities + facility_camera_links, plus courts'
  # new facility_id column), T7.3. Its own generated package
  # (facilitiesdb) mirrors bookingdb's shape but stays a separate Go
  # package, keeping the context boundary visible in generated code too.
  - engine: "postgresql"
    queries:
      - "db/queries/facilities.sql"
    schema: "db/migrations"
    gen:
      go:
        package: "facilitiesdb"
        out: "internal/gen/facilitiesdb"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
  # Competitions context (competitions + competition_sessions +
  # competition_entries), T9.4. Its own generated package (competitionsdb)
  # mirrors bookingdb's shape but stays a separate Go package, keeping the
  # context boundary visible in generated code too — every other context
  # here does the same.
  - engine: "postgresql"
    queries:
      - "db/queries/competitions.sql"
    schema: "db/migrations"
    gen:
      go:
        package: "competitionsdb"
        out: "internal/gen/competitionsdb"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
  # Identity/Users context (identity_users), T10.2. Its own generated
  # package (identitydb) mirrors bookingdb's shape but stays a separate Go
  # package, keeping the context boundary visible in generated code too —
  # every other context here does the same.
  - engine: "postgresql"
    queries:
      - "db/queries/identity.sql"
    schema: "db/migrations"
    gen:
      go:
        package: "identitydb"
        out: "internal/gen/identitydb"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
