syntax = "proto3";

package pickleball.socialplay.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/nhuthuynh/white-label/internal/gen/pickleball/socialplay/v1;socialplayv1";

// GameStatus mirrors internal/socialplay/domain.Status.
enum GameStatus {
  GAME_STATUS_UNSPECIFIED = 0;
  GAME_STATUS_SCHEDULED = 1;
  GAME_STATUS_CANCELLED = 2;
}

// RegistrationStatus mirrors internal/socialplay/domain.RegistrationStatus.
enum RegistrationStatus {
  REGISTRATION_STATUS_UNSPECIFIED = 0;
  REGISTRATION_STATUS_REGISTERED = 1;
  REGISTRATION_STATUS_CANCELLED = 2;
}

// PaymentStatus mirrors internal/socialplay/domain.PaymentStatus. T5 wired
// this read-only; T6.5 is what actually keeps it accurate, via
// internal/payments/adapter/socialplay pushing updates through
// port.RegistrationPaymentUpdater — this field remains read-only on the
// wire (no RPC sets it directly), it just now reflects a real Payment
// instead of always being "unpaid".
enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_UNPAID = 1;
  PAYMENT_STATUS_PAID = 2;
  // PAYMENT_STATUS_REFUNDED (T6.5) mirrors internal/payments/domain.Status's
  // three-state machine exactly rather than collapsing a refund back to
  // unpaid — see the T6.5 PR description's refund-modelling decision.
  PAYMENT_STATUS_REFUNDED = 3;
}

// PaymentMethod mirrors internal/socialplay/domain.PaymentMethod (T8.6/T8.7)
// — the Host's declared accepted payment method(s) for a Game, deliberately
// distinct from PaymentStatus above (see domain.PaymentMethod's doc comment
// for why the two must not be conflated). Style mirrors
// pickleball.payments.v1.PayableType: an UNSPECIFIED zero value plus one
// value per domain.PaymentMethod constant. PAYMENT_METHOD_UNSPECIFIED on an
// inbound CreateGameRequest (an old/unaware client, or a field simply left
// unset) is mapped onto domain.PaymentMethodEither by
// internal/socialplay/adapter/grpcapi — the least restrictive value, for
// the same "closest thing to unspecified" reasoning documented on
// db/migrations/0012_socialplay_guest_capacity.sql's payment_method column
// default.
enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_ONLINE = 1;
  PAYMENT_METHOD_CASH = 2;
  PAYMENT_METHOD_EITHER = 3;
}

// Money mirrors internal/socialplay/domain.Money (T9.2): an amount in
// integer minor units ("cents") paired with its ISO 4217 currency code, per
// ADR-0005 (docs/adr/0005-currency-code-column.md).
//
// This is a deliberate, context-local duplicate of
// pickleball.payments.v1.Money — identical shape, intentionally NOT an
// import of the payments proto package. Social Play's wire contract does
// not depend on the Payments context's, exactly as
// internal/socialplay/domain does not import internal/payments/domain
// (CLAUDE.md rules 2/3); coupling the two protos would reintroduce at the
// API-contract layer precisely the dependency the domain layer refuses.
// The two are free to diverge, and the rules attached to them already do:
// a payments Money of zero is meaningless, whereas a Game's entry_fee of
// zero is a real product state (a free Game).
//
// PCI guardrail (CLAUDE.md rule 11, docs/checklists/proto-review.md): this
// message carries an AMOUNT and a currency code only. It is not, and must
// never become, a place to put a PAN, card number, CVV, or track data —
// card data is tokenized client-side and never reaches this backend
// (SAQ A scope).
message Money {
  int64 amount_cents = 1;
  string currency_code = 2;
}

// Game mirrors internal/socialplay/domain.Game. court_ids is repeated
// (not a single court_id like Booking) because a Game can span multiple
// courts — each one becomes its own game-source Booking via
// internal/socialplay/adapter/booking (T5.3/T5.4).
message Game {
  string id = 1;
  string host_id = 2;
  // facility_id is DEPRECATED (T8.3): the pre-Facilities-context opaque
  // free-text venue identifier (db/migrations/0005_socialplay.sql) with no
  // real relationship to anything. Prefer venue_facility_id below, a real
  // FK into the Facilities context (facilities.id uuid). Retained on the
  // wire so existing readers don't break; slated for removal once nothing
  // depends on it (see db/migrations/0011_socialplay_facility_fk.sql).
  string facility_id = 3;
  repeated string court_ids = 4;
  google.protobuf.Timestamp starts_at = 5;
  google.protobuf.Timestamp ends_at = 6;
  int32 capacity = 7;
  GameStatus status = 8;
  // venue_facility_id (T8.3) is the real Facilities-context Facility ID
  // for this Game's venue, reconciling the opaque facility_id above with
  // facilities.id uuid — see that field's doc comment for the migration
  // context. Optional/nullable in storage; empty string on the wire means
  // this Game has no known venue Facility yet.
  string venue_facility_id = 9;
  // payment_method and guest_allowance mirror
  // internal/socialplay/domain.Game's T8.6 fields, wired onto the wire in
  // T8.7. Field numbers 10/11 (not 9/10) since venue_facility_id (T8.3)
  // already claimed 9 when both landed the same sprint.
  PaymentMethod payment_method = 10;
  int32 guest_allowance = 11;
  // entry_fee (T9.2) is the price the Host set for one player to join this
  // Game, replacing the web client's retired
  // PLACEHOLDER_REGISTRATION_FEE_CENTS. An amount of 0 is a real value
  // meaning a free Game, never "unset" — clients must render it as the
  // word "Free", not as blank or a bare "$0.00" (T9.2 non-functional
  // requirement). An entirely absent entry_fee message on the wire (an
  // old client) is read as free, the same value the migration backfilled
  // pre-existing rows with.
  Money entry_fee = 12;
}

// Registration mirrors internal/socialplay/domain.Registration.
message Registration {
  string id = 1;
  string game_id = 2;
  string player_id = 3;
  RegistrationStatus status = 4;
  PaymentStatus payment_status = 5;
  // guest_count mirrors internal/socialplay/domain.Registration.GuestCount
  // (T8.6), wired onto the wire in T8.7.
  int32 guest_count = 6;
}

// WaitlistStatus mirrors internal/socialplay/domain.WaitlistStatus (T6.6).
enum WaitlistStatus {
  WAITLIST_STATUS_UNSPECIFIED = 0;
  WAITLIST_STATUS_WAITING = 1;
  WAITLIST_STATUS_PROMOTED = 2;
  WAITLIST_STATUS_EXPIRED = 3;
  WAITLIST_STATUS_CANCELLED = 4;
}

// WaitlistEntry mirrors internal/socialplay/domain.WaitlistEntry (T6.6,
// ADR-0006). promoted_at is unset (default Timestamp) until the entry is
// actually promoted.
message WaitlistEntry {
  string id = 1;
  string game_id = 2;
  string player_id = 3;
  int32 position = 4;
  WaitlistStatus status = 5;
  google.protobuf.Timestamp promoted_at = 6;
}

message CreateGameRequest {
  // DEPRECATED (T12.8): ignored by the server. The new Game is hosted by the
  // verified bearer token's principal, not by whoever this field names.
  // This one is a *privilege* field, which is why it moved with the
  // actor_player_id/actor_user_id fields rather than being left alone:
  // honoring it would let any caller mint a Game hosted by a subject that is
  // not theirs, while CancelGame and RecordMatchResult compare the caller
  // against a verified subject — so either real Hosts are locked out of their
  // own Games or Host-ship is handed to someone else. Same reasoning T12.7
  // applied to CreateFacilityRequest.owner_id. Retained, not deleted, because
  // removing a proto field is a breaking wire change and web/ still sends it
  // until its own follow-up.
  string host_id = 1 [deprecated = true];
  // facility_id is DEPRECATED (T8.3) — see Game.facility_id's doc comment.
  // Prefer venue_facility_id below.
  string facility_id = 2;
  repeated string court_ids = 3;
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.Timestamp ends_at = 5;
  int32 capacity = 6;
  // venue_facility_id (T8.3) — see Game.venue_facility_id's doc comment.
  // Optional: an unset/empty value schedules a Game with no known venue
  // Facility, exactly like today; a non-empty value that doesn't refer to
  // a real Facility is rejected (404 NOT_FOUND).
  string venue_facility_id = 7;
  // payment_method and guest_allowance (T8.7): see Game's doc comment on
  // these same two fields, and PaymentMethod's doc comment for what an
  // unset/UNSPECIFIED payment_method resolves to. Field numbers 8/9 (not
  // 7/8) since venue_facility_id (T8.3) already claimed 7 when both landed
  // the same sprint.
  PaymentMethod payment_method = 8;
  int32 guest_allowance = 9;
  // entry_fee (T9.2) — see Game.entry_fee's doc comment. Optional on the
  // wire: an unset entry_fee schedules a free Game (amount 0), which is a
  // real product state, not a missing value. A negative amount is rejected
  // (400 INVALID_ARGUMENT via domain.ErrInvalidMoney), as is a non-zero
  // amount with a missing or malformed currency_code.
  Money entry_fee = 10;
}

message CreateGameResponse {
  Game game = 1;
}

// RegisterForGameRequest registers the *verified caller* for a Game (T12.8).
// The acting player is the bearer token's principal; player_id below is
// retained only for wire compatibility and is ignored.
message RegisterForGameRequest {
  string game_id = 1;
  // DEPRECATED (T12.8): ignored by the server. The registering player is the
  // verified principal. It is a privilege field for the same reason
  // CreateGameRequest.host_id is: this is the value
  // domain.Registration.Cancel later compares an actor against, so a
  // Registration minted for a claimed player_id could never be cancelled by
  // the human it names. Retained, not deleted — removing a proto field is a
  // breaking wire change and web/ still sends it until its own follow-up.
  string player_id = 2 [deprecated = true];
  // guest_count (T8.7) mirrors Registration.guest_count — see
  // domain.Register's doc comment for the guest-allowance and weighted
  // capacity checks this value is validated against.
  int32 guest_count = 3;
}

message RegisterForGameResponse {
  Registration registration = 1;
}

// CancelRegistrationRequest cancels the *verified caller's* own Registration.
//
// T12.8 closed the gap this message's doc comment used to describe: the
// object-level check (only the registering player may cancel their own
// registration, domain.Registration.Cancel) is unchanged, but the identity it
// compares against is now the verified bearer token's principal rather than a
// string the caller supplied about themselves.
message CancelRegistrationRequest {
  string registration_id = 1;
  // DEPRECATED (T12.8): ignored by the server. The acting player is taken from
  // the verified bearer token's principal, never from this field. Retained,
  // not deleted, because removing a proto field is a breaking wire change and
  // web/ still sends it until its own follow-up; a client that still populates
  // it is neither helped nor harmed.
  string actor_player_id = 2 [deprecated = true];
}

message CancelRegistrationResponse {
  Registration registration = 1;
}

// JoinWaitlistRequest puts the *verified caller* on a Game's waitlist (T12.8).
message JoinWaitlistRequest {
  string game_id = 1;
  // DEPRECATED (T12.8): ignored by the server. The joining player is the
  // verified principal. A WaitlistEntry's player becomes a Registration's
  // player on promotion, so honoring a claimed value here would propagate it
  // into the aggregate CancelRegistration guards. Retained, not deleted, for
  // the wire-compatibility reason the other deprecated fields state.
  string player_id = 2 [deprecated = true];
}

message JoinWaitlistResponse {
  WaitlistEntry entry = 1;
}

// GameListing pairs a Game with SpotsLeft, a server-computed field (T8.9,
// Discover & Join Games): capacity minus the weighted sum of
// (1 + guest_count) across this Game's active (non-cancelled)
// registrations — the same weighting domain.Register's own capacity check
// uses (internal/socialplay/domain/registration.go's doc comment). A
// dedicated wrapper rather than a field on Game itself, since SpotsLeft is
// a derived read-model value for this one browse/list path, not part of
// the Game aggregate — mirrors GetFacilityResponse's "Courts is a sibling
// response field, not a Facility field" precedent (T8.2's doc comment in
// facilities.proto) for the same "don't bloat the aggregate message for one
// read path" reasoning.
message GameListing {
  Game game = 1;
  int32 spots_left = 2;
}

// ListGamesRequest is the Discover & Join Games browse/filter read (T8.9).
// socialplay.proto had no list/browse RPC before this ticket (confirmed by
// inspection per the ticket's Instructions #1) — this follows the
// migration-free-read-path pattern T7.3 (ListFacilities)/T8.2
// (ListCourtsForFacility) established: a new RPC plus a straightforward
// sqlc query against the existing games/registrations tables, no schema
// change.
//
// venue_facility_id and the starts_after/starts_before window are both
// optional (empty/unset = no filter on that dimension) — mirrors
// ListFacilitiesRequest.name_filter's "empty means unfiltered" convention.
// Only scheduled Games are ever returned (see db/queries/socialplay.sql's
// ListGames query) — a cancelled Game isn't joinable, so it has no place in
// a player-facing browse list.
message ListGamesRequest {
  string venue_facility_id = 1;
  google.protobuf.Timestamp starts_after = 2;
  google.protobuf.Timestamp starts_before = 3;
}

message ListGamesResponse {
  repeated GameListing games = 1;
}

// ListRegistrationsForGameRequest/Response (T8.10, Payments UI): added as a
// disclosed backend finding, not part of that ticket's original "pure
// frontend" scope — the Host pending-cash-payments dashboard (Flow 6) needs
// to enumerate a Game's Registrations to find which are still
// PaymentStatus == unpaid, and no RPC on this service exposed that read
// before (confirmed by inspection: RegistrationRepository.ListActiveForGame
// was reachable only internally, from RegisterForGame's own capacity
// pre-check). Mirrors ListGamesRequest/Response's "migration-free-read-path"
// shape (T8.2, T8.9 set the same precedent for an analogous missing-list-RPC
// gap) — no schema change, no new domain type.
message ListRegistrationsForGameRequest {
  string game_id = 1;
}

message ListRegistrationsForGameResponse {
  repeated Registration registrations = 1;
}

// Match mirrors internal/socialplay/domain.Match (T10.3/T10.4): a recorded
// result against an existing Game. score is a per-player point-total map,
// keyed by the same player-id strings that appear in players — deliberately
// the simplest shape that records a real result (see domain.Match.Score's
// doc comment for why a richer shape, e.g. set-by-set, is left for a future
// ticket that actually needs it).
//
// Explicitly not on this message, per ADR-0012 (docs/adr/
// 0012-identity-users-and-match-built-rating-and-matching-algorithm-blocked-
// on-escalated-decisions.md): no player_rating field or anything deriving a
// rating from this result. A Match is a recorded fact only.
message Match {
  string id = 1;
  string game_id = 2;
  repeated string players = 3;
  map<string, int32> score = 4;
  google.protobuf.Timestamp recorded_at = 5;
}

// RecordMatchResultRequest records a Match result on behalf of the *verified
// caller*.
//
// T12.8 closed the gap this comment used to describe. The object-level check
// is unchanged (only the Game's Host or an assigned Game Admin may record a
// result, domain.Game.EnsureHostOrGameAdmin); what changed is that the
// identity it compares against is the verified bearer token's principal
// rather than a caller-supplied string.
//
// assigned_game_admin_user_ids is a caller-supplied fact, not a persisted
// one — this codebase has never built a durable Game-Admin-assignment
// mechanism (mirrors pickleball.payments.v1.RecordOfflinePaymentRequest's
// identical assigned_game_admin_user_ids field and its own doc comment for
// the same gap, T6.3).
message RecordMatchResultRequest {
  string game_id = 1;
  repeated string players = 2;
  map<string, int32> score = 3;
  // DEPRECATED (T12.8): ignored by the server. The acting user is taken from
  // the verified bearer token's principal. Note this field and
  // CancelGameRequest.actor_player_id are both compared against the same
  // stored Game.host_id — they were never two identifier spaces, only two
  // names for one (see T12.8's PR body). Retained, not deleted, for the
  // wire-compatibility reason the other deprecated fields state.
  string actor_user_id = 4 [deprecated = true];
  repeated string assigned_game_admin_user_ids = 5;
}

message RecordMatchResultResponse {
  Match match = 1;
}

// ListMatchesForGameRequest/Response (T10.4). Unlike
// ListRegistrationsForGameRequest's "empty roster for an unknown game"
// read, an unknown game_id here answers NOT_FOUND (see
// app.Service.ListMatchesForGame's doc comment for why).
message ListMatchesForGameRequest {
  string game_id = 1;
}

message ListMatchesForGameResponse {
  repeated Match matches = 1;
}

// CancelGameRequest cancels a Game on behalf of the *verified caller*.
//
// T12.8 closed the gap this comment used to describe, and this RPC is named
// explicitly in that ticket because it shipped one wave earlier (T12.4) with a
// claimed actor. The object-level check is unchanged — only the Game's Host
// may cancel it, domain.Game.EnsureHost — but the identity it compares against
// is now the verified bearer token's principal.
//
// Deliberately Host-only, and deliberately WITHOUT the
// assigned_game_admin_user_ids field RecordMatchResultRequest carries: a
// Game Admin may record a match result but may not cancel the Game.
// Cancelling is destructive and irreversible, so it is not delegated. See
// domain.ErrNotGameHost's doc comment for the full reasoning — do not
// "harmonize" this message with RecordMatchResultRequest by adding an
// admin list, which would silently widen who can cancel a Game.
//
// KNOWN GAP (tracked in GitHub issue #124, not re-litigated here):
// cancelling a Game does not cascade to the court Bookings it reserved or
// to its Registrations.
message CancelGameRequest {
  string game_id = 1;
  // DEPRECATED (T12.8): ignored by the server. The acting player is taken from
  // the verified bearer token's principal. T12.8 is the ticket that makes the
  // EnsureHost check above rest on a verified identity rather than a typed
  // one — this RPC is named explicitly in that ticket because it shipped one
  // wave earlier with a claimed actor. Retained, not deleted, for the
  // wire-compatibility reason the other deprecated fields state.
  string actor_player_id = 2 [deprecated = true];
}

message CancelGameResponse {
  Game game = 1;
}

// SocialPlayService is the API contract for the Social Play bounded
// context, mirroring BookingService's style (proto/pickleball/booking/v1) —
// buf generates gRPC, a grpc-gateway REST mapping, and OpenAPI from this
// file.
service SocialPlayService {
  // CreateGame schedules a Game and reserves one Booking per court via the
  // Booking context (internal/socialplay/adapter/booking).
  rpc CreateGame(CreateGameRequest) returns (CreateGameResponse) {
    option (google.api.http) = {
      post: "/v1/games"
      body: "*"
    };
  }

  // RegisterForGame registers a player into a Game, enforcing the capacity
  // and no-double-registration invariants.
  rpc RegisterForGame(RegisterForGameRequest) returns (RegisterForGameResponse) {
    option (google.api.http) = {
      post: "/v1/games/{game_id}/registrations"
      body: "*"
    };
  }

  // CancelRegistration cancels a registration, but only when
  // actor_player_id matches the registration's own player (object-level
  // check — see CancelRegistrationRequest's doc comment on what this does
  // and does not prove without real auth).
  rpc CancelRegistration(CancelRegistrationRequest) returns (CancelRegistrationResponse) {
    option (google.api.http) = {
      post: "/v1/registrations/{registration_id}:cancel"
      body: "*"
    };
  }

  // JoinWaitlist queues a player for a full Game (T6.6, ADR-0006): only
  // legal when the Game is actually full (domain.JoinWaitlist). Automatic
  // promotion on a Registration cancelling, and the response-timeout
  // expiry/cascade, are app-layer/DB-level mechanisms
  // (app.Service.CancelRegistration / ExpireWaitlistPromotion) with no
  // dedicated RPCs of their own in this ticket — a promotion is confirmed
  // simply by the promoted player calling RegisterForGame like anyone else
  // (see that method's doc comment).
  rpc JoinWaitlist(JoinWaitlistRequest) returns (JoinWaitlistResponse) {
    option (google.api.http) = {
      post: "/v1/games/{game_id}/waitlist"
      body: "*"
    };
  }

  // ListGames is the Discover & Join Games browse/filter read (T8.9) — see
  // ListGamesRequest's doc comment for why this RPC exists (there was no
  // list/browse RPC on this service before).
  rpc ListGames(ListGamesRequest) returns (ListGamesResponse) {
    option (google.api.http) = {
      get: "/v1/games"
    };
  }

  // ListRegistrationsForGame is the Host pending-cash-payments dashboard's
  // read (T8.10) — see ListRegistrationsForGameRequest's doc comment for
  // why this RPC exists (there was no way to list a Game's Registrations
  // before it). A GET on the same path RegisterForGame POSTs to (standard
  // REST: GET lists a collection, POST creates into it).
  //
  // **Requires a verified caller, who must be the Game's Host** (T13.6,
  // partial fix for #147). This RPC shipped public and returned every
  // registrant's player_id, payment_status and guest_count to anyone holding
  // a game_id — a value the public ListGames response supplies. No token is
  // codes.Unauthenticated (HTTP 401); a token belonging to anyone but the
  // Host is codes.PermissionDenied (HTTP 403). There is deliberately no
  // actor field on the request: the acting identity comes from the bearer
  // token, never from the wire, exactly as for this service's other
  // authenticated RPCs (T12.8).
  //
  // Assigned Game Admins are NOT yet entitled to this read, though they
  // arguably should be — the assigned-admin list is caller-supplied and
  // persisted nowhere, so honouring it would let any caller name themselves
  // an admin. Tracked as #168; Host-only is the honest narrower rule until a
  // durable Game-Admin store exists.
  rpc ListRegistrationsForGame(ListRegistrationsForGameRequest) returns (ListRegistrationsForGameResponse) {
    option (google.api.http) = {
      get: "/v1/games/{game_id}/registrations"
    };
  }

  // RecordMatchResult records a Match result against an existing Game
  // (T10.4), authorized to the Game's Host or an assigned Game Admin only
  // (domain.Game.EnsureHostOrGameAdmin) — see RecordMatchResultRequest's
  // doc comment on the known actor-verification gap.
  rpc RecordMatchResult(RecordMatchResultRequest) returns (RecordMatchResultResponse) {
    option (google.api.http) = {
      post: "/v1/games/{game_id}/matches"
      body: "*"
    };
  }

  // ListMatchesForGame lists every Match recorded against a Game (T10.4) —
  // see ListMatchesForGameRequest's doc comment for why an unknown game_id
  // answers NOT_FOUND here, unlike ListRegistrationsForGame's "empty
  // roster" convention.
  rpc ListMatchesForGame(ListMatchesForGameRequest) returns (ListMatchesForGameResponse) {
    option (google.api.http) = {
      get: "/v1/games/{game_id}/matches"
    };
  }

  // CancelGame cancels a Game, but only when actor_player_id is that Game's
  // own Host (object-level check — domain.Game.EnsureHost; see
  // CancelGameRequest's doc comment on what this does and does not prove
  // without real auth, and on why a Game Admin is NOT permitted here even
  // though RecordMatchResult above accepts one).
  //
  // Verb-suffixed path, mirroring CancelRegistration's
  // "/v1/registrations/{registration_id}:cancel" — a cancellation is a
  // state transition on an existing resource, not a DELETE of it (the Game
  // row survives, with status cancelled).
  rpc CancelGame(CancelGameRequest) returns (CancelGameResponse) {
    option (google.api.http) = {
      post: "/v1/games/{game_id}:cancel"
      body: "*"
    };
  }
}
