syntax = "proto3";

package pickleball.identity.v1;

import "google/api/annotations.proto";

option go_package = "github.com/nhuthuynh/white-label/internal/gen/pickleball/identity/v1;identityv1";

// Role mirrors internal/identity/domain.Role (T10.1) — a closed enum, per
// docs/agent-operating-handbook.md A1's Identity/Users bounded-context
// summary. A single User can hold more than one Role at once (e.g. a Host
// who is also a Player) — see User.roles below, a repeated field, not a
// single value.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_PLAYER = 1;
  ROLE_HOST_ORGANISER = 2;
  ROLE_GAME_ADMIN = 3;
  ROLE_FACILITY_OWNER = 4;
  ROLE_CLUB = 5;
  ROLE_PLATFORM_ADMIN = 6;
}

// User mirrors internal/identity/domain.User (T10.1).
//
// Explicitly not built here, per ADR-0012
// (docs/adr/0012-identity-users-and-match-built-rating-and-matching-algorithm-blocked-on-escalated-decisions.md):
// no player_rating field, no derived level, no gender field, no
// matching-mode flag. self_reported_starting_level below is the raw
// self-reported input the locked CLAUDE.md decision specifies for
// cold-start seeding ("new players seeded by a self-reported starting
// level") — it is NOT an answer to ADR-0012's still-open Q1 (the
// tenure+win-rate-weighted, history-derived Level formula); see domain.
// User's doc comment for the full reasoning this message deliberately does
// not restate.
message User {
  string id = 1;
  string display_name = 2;
  repeated Role roles = 3;
  // self_reported_starting_level is a 1..5 self-assessment scale
  // (domain.SelfReportedStartingLevel) — see this message's doc comment.
  int32 self_reported_starting_level = 4;
}

// CreateUserRequest registers the VERIFIED CALLER as a new User (T12.9).
//
// The server mints the new User's id and keys the row to the caller's
// verified IdP subject (the token's `sub` claim), taken from
// internal/platform/auth.Principal. Nothing in this message determines who
// the created User is.
//
// WHY actor_user_id IS STILL HERE AND WHAT IT DOES NOW: nothing. It is
// deprecated and ignored by the handler. Before T12.9 this field BECAME the
// new row's permanent primary key, which meant any anonymous caller could
// name any uuid — including one a real-auth integration would later mint
// for a real person — and permanently occupy that identity; the real
// owner's later registration then failed with AlreadyExists forever. That
// was a persistent, targeted denial-of-service (HANDOFF.md's T10.2 bullet),
// and it is closed by removing the field's power rather than validating it
// more carefully. The field is retained rather than deleted only because
// removing a proto field breaks existing clients, and web/ still sends it
// until its own follow-up; it will be deleted in a later release. A server
// that fell back to this value when no principal was present would have
// changed nothing, so the handler does not read it under any circumstance.
//
// This RPC now REQUIRES an authenticated caller
// (grpcapi.AuthenticatedMethods): there is no anonymous path to user
// creation at all. Errors, gRPC codes only — grpc-gateway maps them to HTTP
// on its own:
//
//   * no verified caller -> UNAUTHENTICATED
//   * the caller's subject is already registered -> ALREADY_EXISTS (a
//     self-collision only: a verified subject can only ever collide with
//     itself). The second call is REJECTED, not answered idempotently with
//     the stored user, because it carries its own display name and level
//     and replaying the first would silently discard them.
//   * empty display_name, empty/invalid roles, out-of-range level, or a
//     role other than ROLE_PLAYER -> INVALID_ARGUMENT. Holding a valid
//     token proves who you are, not that you may appoint yourself an
//     administrator, so self-registration still accepts ROLE_PLAYER only.
message CreateUserRequest {
  // Deprecated: ignored by the server since T12.9. The created User's id is
  // server-minted and its owner is the verified token subject. Retained for
  // wire compatibility only; do not send it in new clients.
  string actor_user_id = 1 [deprecated = true];
  string display_name = 2;
  repeated Role roles = 3;
  int32 self_reported_starting_level = 4;
}

message CreateUserResponse {
  User user = 1;
}

// GetUserRequest.user_id is a public, unauthenticated read — deliberately
// left that way by T12.9, which authenticated CreateUser and
// UpdateSelfReportedLevel but NOT this RPC: it is a shipped anonymous read
// and quietly authenticating it would break a live flow for no security
// gain. Note that User carries no `subject` field, so this public read does
// not expose any caller's identity-provider identifier.
//
// For GetUserRequest.user_id itself, a malformed id and an
// unknown-but-well-formed one must be indistinguishable to the caller
// (NotFound for both), the same convention every other read RPC in this
// codebase's malformed-ID boundary guard establishes (see
// app.Service.GetUser's doc comment, PR #89's postmortem in
// docs/LESSONS.md).
message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

// UpdateSelfReportedLevelRequest requires that the verified caller IS the
// target user_id (domain.User.EnsureSelf, T10.2) — only a User may update
// their own self-reported level, nobody else's.
//
// T12.9: the actor is now resolved from the verified token subject, not
// from this message. The handler looks up the User registered to the
// caller's subject and compares THAT user's id against user_id, so the
// check is on a verified fact rather than a claim. Errors, gRPC codes only:
//
//   * no verified caller -> UNAUTHENTICATED
//   * a verified caller who is not this User — including one with no
//     registered User of their own — -> PERMISSION_DENIED. Deliberately
//     the same answer in both cases: telling an authenticated stranger
//     "that user exists but you have no account" leaks more than refusing.
message UpdateSelfReportedLevelRequest {
  string user_id = 1;
  // Deprecated: ignored by the server since T12.9. The actor is the
  // verified token subject. Retained for wire compatibility only.
  string actor_user_id = 2 [deprecated = true];
  int32 self_reported_starting_level = 3;
}

message UpdateSelfReportedLevelResponse {
  User user = 1;
}

// IdentityService is the API contract for the Identity/Users bounded
// context, mirroring FacilitiesService's/BookingService's style
// (proto/pickleball/facilities/v1, proto/pickleball/booking/v1) — buf
// generates gRPC, a grpc-gateway REST mapping, and OpenAPI from this file.
service IdentityService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
  }

  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}"
    };
  }

  rpc UpdateSelfReportedLevel(UpdateSelfReportedLevelRequest) returns (UpdateSelfReportedLevelResponse) {
    option (google.api.http) = {
      post: "/v1/users/{user_id}/selfReportedLevel"
      body: "*"
    };
  }
}
