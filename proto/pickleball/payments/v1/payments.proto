syntax = "proto3";

package pickleball.payments.v1;

import "google/api/annotations.proto";

option go_package = "github.com/nhuthuynh/white-label/internal/gen/pickleball/payments/v1;paymentsv1";

// PayableType mirrors internal/payments/domain.PayableType — extensible by
// design (T6.1): booking, registration, and no_show_fee were the values T6
// produced; T10.6 (closes #96) adds PAYABLE_TYPE_COMPETITION_ENTRY, in the
// same PR that first produces its caller
// (internal/payments/adapter/competitions), per this enum's own extension
// policy. See domain.PayableType's doc comment for why recurring_hire /
// subscription are named as future values but not added as enum values
// yet.
enum PayableType {
  PAYABLE_TYPE_UNSPECIFIED = 0;
  PAYABLE_TYPE_BOOKING = 1;
  PAYABLE_TYPE_REGISTRATION = 2;
  PAYABLE_TYPE_NO_SHOW_FEE = 3;
  PAYABLE_TYPE_COMPETITION_ENTRY = 4;
}

// PaymentMethod mirrors internal/payments/domain.Method.
enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_ONLINE = 1;
  PAYMENT_METHOD_OFFLINE = 2;
}

// PaymentStatus mirrors internal/payments/domain.Status.
enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_UNPAID = 1;
  PAYMENT_STATUS_PAID = 2;
  PAYMENT_STATUS_REFUNDED = 3;
}

// Money mirrors internal/payments/domain.Money (ADR-0005: amount and
// currency are coupled in the same type, never a bare cents value).
// currency_code is an ISO 4217 3-letter code (e.g. "USD").
//
// PCI guardrail (docs/checklists/proto-review.md): this message, and every
// other message in this file, carries only an amount + currency + opaque
// identifiers — never a card number, CVV/CVC, or track-data field. Card
// data is tokenized client-side and never reaches this backend (SAQ A
// scope).
message Money {
  int64 amount_cents = 1;
  string currency_code = 2;
}

// Payment mirrors internal/payments/domain.Payment. stripe_reference is an
// opaque processor reference (a Stripe PaymentIntent id in a real
// adapter — internal/payments/port.PaymentProcessor is processor-agnostic
// by design, T6.2) — never a card-shaped field, per the PCI guardrail
// above. It is empty for an offline Payment. recorded_by_user_id is empty
// for an online, Stripe-driven Payment.
message Payment {
  string id = 1;
  PayableType payable_type = 2;
  string payable_id = 3;
  Money amount = 4;
  PaymentMethod method = 5;
  PaymentStatus status = 6;
  string stripe_reference = 7;
  string recorded_by_user_id = 8;
}

// RecordOfflinePaymentRequest is the offline-recording use case (T6.3),
// performed by the *verified caller* as of T12.8.
//
// The object-level check is unchanged (only the Booking's Host, or the
// Registration's Game's Host/an assigned Game Admin, may record a payment for
// that payable action); what changed at T12.8 is that the acting identity it
// compares against is the verified bearer token's principal rather than a
// string the caller supplied about themselves.
//
// T16.2 (closes #168) closes the ownership-*fact* gap T12.8 narrowed but left
// open, for every payable type except booking: game_host_id,
// assigned_game_admin_user_ids, entrant_player_id and
// assigned_competition_admin_user_ids below are now [deprecated = true] and
// IGNORED BY THE SERVER — internal/payments/app.Service resolves the
// equivalent facts itself, from payable_id alone, against the real Social
// Play/Competitions stores (port.RegistrationLookup/GameLookup/
// GameAdminReader/EntryLookup/CompetitionAdminReader — see
// internal/payments/app/service.go's doc comment for the full mechanism).
// This is what T15.5's own note on these fields anticipated: "T15.5 built
// both admin stores' durable *existence* into a consumable read-side port...
// but could not wire either into authorizeOfflineRecording" because neither
// this request nor app.RecordOfflinePaymentInput carried a gameID/
// competitionID for the payable types that needed one — only payable_id. This
// ticket built exactly that missing resolution read
// (socialplayapp.Service.GetRegistrationByID/GetGame,
// competitionsapp.Service.GetEntryByID) and wired it in, which is what makes
// marking these four fields deprecated now honest where it would have been
// false at T15.5 time (the comment these fields carried then said so
// explicitly).
//
// booking_host_id is NOT deprecated and stays load-bearing: Payments still
// has no live join to Booking's database (ADR-0015's still-open D1 blocks
// the identical resolution this ticket just built for the other two
// contexts), so a PAYABLE_TYPE_BOOKING payable is authorized against this
// caller-supplied field exactly as before. Tracked as issue #149, narrowed
// by this ticket to this one remaining fact — "#168 closed" does not mean
// "every ownership fact this RPC accepts is now verified", and this comment
// exists so a reader of the wire contract sees that distinction directly,
// not only in a PR description.
message RecordOfflinePaymentRequest {
  PayableType payable_type = 1;
  string payable_id = 2;
  Money amount = 3;
  // DEPRECATED (T12.8): ignored by the server. The acting user is taken from
  // the verified bearer token's principal, never from this field — for both
  // the authorization check and Payment.recorded_by_user_id, so a caller can
  // no longer record a payment under someone else's name in the audit trail.
  // Retained, not deleted, because removing a proto field is a breaking wire
  // change and web/ still sends it until its own follow-up.
  string actor_user_id = 4 [deprecated = true];

  // NOT deprecated: still load-bearing for PAYABLE_TYPE_BOOKING, and still
  // caller-supplied/forgeable — see this message's own doc comment and issue
  // #149.
  string booking_host_id = 5;

  // DEPRECATED (T16.2, closes #168): ignored by the server. The Registration's
  // Game's Host is now resolved server-side from payable_id via
  // port.RegistrationLookup/GameLookup, not accepted from the caller.
  // Retained, not deleted, for the same wire-compatibility reason
  // actor_user_id above gives.
  string game_host_id = 6 [deprecated = true];
  // DEPRECATED (T16.2, closes #168): ignored by the server. The Registration's
  // Game's current admin set is now resolved server-side from payable_id via
  // port.RegistrationLookup/GameAdminReader, not accepted from the caller.
  repeated string assigned_game_admin_user_ids = 7 [deprecated = true];

  // DEPRECATED (T16.2, closes #168): ignored by the server. The
  // CompetitionEntry's own PlayerID is now resolved server-side from
  // payable_id via port.EntryLookup, not accepted from the caller.
  string entrant_player_id = 8 [deprecated = true];
  // DEPRECATED (T16.2, closes #168): ignored by the server. The
  // CompetitionEntry's Competition's current admin set is now resolved
  // server-side from payable_id via port.EntryLookup/CompetitionAdminReader,
  // not accepted from the caller.
  repeated string assigned_competition_admin_user_ids = 9 [deprecated = true];
}

message RecordOfflinePaymentResponse {
  Payment payment = 1;
}

// CreateOnlinePaymentRequest starts the online/Stripe path (T6.2): builds
// an unpaid Payment and authorizes an intent against
// port.PaymentProcessor. No card data ever appears on this request — see
// the PCI guardrail on the Money message above; the client tokenizes the
// card directly with Stripe before this call, and confirms via
// ConfirmOnlinePayment below.
//
// actor_user_id / entrant_player_id / assigned_competition_admin_user_ids
// (T10.6, closes #96) are new, PAYABLE_TYPE_COMPETITION_ENTRY-scoped
// fields — a caller-claimed identity, the same known-gap caveat every
// other actor_user_id field in this codebase carries (not yet a verified
// identity; see RecordOfflinePaymentRequest's doc comment). They are
// validated only when payable_type is PAYABLE_TYPE_COMPETITION_ENTRY; every
// other payable type this request accepts is unaffected and continues to
// require no actor at all, exactly as before T10.6 (see
// app.CreateOnlinePaymentInput's doc comment for why extending this to
// those pre-existing types is out of this ticket's scope).
//
// T15.5 sibling-sweep finding (§A15), RE-VERIFIED AND STILL TRUE AS OF T16.2
// (this ticket's own required sibling sweep, instruction 10): entrant_player_id
// / assigned_competition_admin_user_ids here are the same
// caller-supplied-entitlement fields RecordOfflinePaymentRequest's four fields
// were before this ticket, reachable through authorizeOnlineCreation rather
// than authorizeOfflineRecording — a genuinely different authorization branch,
// on a genuinely different RPC (CreateOnlinePayment, not RecordOfflinePayment/
// RefundPayment). T16.2 wires its five new resolver ports into
// authorizeOfflineRecording ONLY, per its own instructions — authorizeOnlineCreation
// is untouched, so these two fields are NOT deprecated and stay exactly as
// caller-supplied and forgeable as before. This is a real, named gap, not an
// oversight: closing it is mechanically identical to what this ticket just did
// for authorizeOfflineRecording (the same port.EntryLookup/CompetitionAdminReader
// would answer it), and is tracked as issue #198 rather than folded in here
// silently.
message CreateOnlinePaymentRequest {
  PayableType payable_type = 1;
  string payable_id = 2;
  Money amount = 3;

  // DEPRECATED (T12.8): ignored by the server. The acting user is taken from
  // the verified bearer token's principal. Retained, not deleted, for the
  // wire-compatibility reason RecordOfflinePaymentRequest's field states.
  string actor_user_id = 4 [deprecated = true];

  string entrant_player_id = 5;
  repeated string assigned_competition_admin_user_ids = 6;
}

message CreateOnlinePaymentResponse {
  Payment payment = 1;
}

// ConfirmOnlinePaymentRequest captures funds for a previously created
// intent (payment_id refers to the Payment CreateOnlinePayment returned).
message ConfirmOnlinePaymentRequest {
  string payment_id = 1;
}

message ConfirmOnlinePaymentResponse {
  Payment payment = 1;
}

// RefundPaymentRequest refunds an already-paid Payment (T12.3, closing the
// gap open since T6.5: domain.Payment.Refund() and
// port.PaymentProcessor.RefundPayment both existed with no caller and no
// RPC, so PAYMENT_STATUS_REFUNDED was a status no request could reach).
//
// PCI guardrail (CLAUDE.md rule 11, reviewed against
// docs/checklists/proto-review.md): this message carries only a payment
// identifier and the actor/ownership facts the authorization check needs —
// never a PAN, card number, CVV/CVC or track data. There is nothing to
// tokenize here at all: the processor reference used to actually move the
// money back is the opaque stripe_reference already stored on the Payment
// (see the Payment message above), never a field on this request.
//
// payable type is deliberately NOT a field: it is read from the stored
// Payment, because accepting it from the caller would let a request choose
// which branch of the authorization check judges it (claiming `booking` on
// a registration Payment to be checked against a booking_host_id the
// caller also supplies) — see app.RefundPaymentInput's doc comment.
//
// actor_user_id is now taken from the verified principal (T12.8) and the wire
// field is ignored — this is the RPC that moves real money back out, so the
// care taken above to read the payable type from the *stored* Payment is only
// as good as the actor the chosen branch compares.
//
// T16.2 (closes #168): game_host_id / assigned_game_admin_user_ids are now
// [deprecated = true] and IGNORED BY THE SERVER, for the identical reason and
// via the identical mechanism RecordOfflinePaymentRequest's own comment
// records — a refund reuses authorizeOfflineRecording unchanged (T12.3's own
// rule, still true), so the same resolution this ticket built for recording
// applies here with no second implementation. booking_host_id is NOT
// deprecated, for the identical reason and issue (#149) RecordOfflinePaymentRequest's
// booking_host_id field states.
//
// Scope: `booking` and `registration` payables only. A
// PAYABLE_TYPE_COMPETITION_ENTRY Payment is rejected — Competitions
// remains cash-only for refund purposes (issue #125) — as is
// PAYABLE_TYPE_NO_SHOW_FEE (issue #130). (Scope note, unaffected by this
// ticket: since RefundPayment never reaches
// authorizeCompetitionEntryRecording, EntryLookup/CompetitionAdminReader are
// wired into app.Service for RecordOfflinePayment's benefit only, not
// because RefundPayment needs them.)
message RefundPaymentRequest {
  string payment_id = 1;
  // DEPRECATED (T12.8): ignored by the server. The acting user is taken from
  // the verified bearer token's principal. Retained, not deleted, for the
  // wire-compatibility reason RecordOfflinePaymentRequest's field states.
  string actor_user_id = 2 [deprecated = true];

  // NOT deprecated: still load-bearing for PAYABLE_TYPE_BOOKING, and still
  // caller-supplied/forgeable — see this message's own doc comment and issue
  // #149.
  string booking_host_id = 3;

  // DEPRECATED (T16.2, closes #168): ignored by the server. See
  // RecordOfflinePaymentRequest.game_host_id's identical comment.
  string game_host_id = 4 [deprecated = true];
  // DEPRECATED (T16.2, closes #168): ignored by the server. See
  // RecordOfflinePaymentRequest.assigned_game_admin_user_ids's identical
  // comment.
  repeated string assigned_game_admin_user_ids = 5 [deprecated = true];
}

message RefundPaymentResponse {
  Payment payment = 1;
}

// PaymentsService is the API contract for the Payments bounded context,
// mirroring BookingService's/SocialPlayService's style
// (proto/pickleball/booking/v1, proto/pickleball/socialplay/v1) — buf
// generates gRPC, a grpc-gateway REST mapping, and OpenAPI from this file.
//
// Reviewed against docs/checklists/proto-review.md's PCI guardrail before
// merging (T6.4 PR description confirms this explicitly): no message in
// this file carries a PAN/card-number/CVV/track-data field.
service PaymentsService {
  // RecordOfflinePayment records a cash/bank-transfer/manually-charged
  // payment (T6.3). Returns 409 (AlreadyExists) on a duplicate
  // (payable_type, payable_id), and 403-shaped (PermissionDenied) on an
  // actor/ownership mismatch — see internal/payments/adapter/grpcapi's
  // toStatus.
  rpc RecordOfflinePayment(RecordOfflinePaymentRequest) returns (RecordOfflinePaymentResponse) {
    option (google.api.http) = {
      post: "/v1/payments:recordOffline"
      body: "*"
    };
  }

  // CreateOnlinePayment starts the Stripe path: builds an unpaid Payment
  // and authorizes an intent (T6.2).
  rpc CreateOnlinePayment(CreateOnlinePaymentRequest) returns (CreateOnlinePaymentResponse) {
    option (google.api.http) = {
      post: "/v1/payments:createOnline"
      body: "*"
    };
  }

  // ConfirmOnlinePayment captures funds for a previously created intent
  // and transitions the Payment to paid (T6.2).
  rpc ConfirmOnlinePayment(ConfirmOnlinePaymentRequest) returns (ConfirmOnlinePaymentResponse) {
    option (google.api.http) = {
      post: "/v1/payments/{payment_id}:confirmOnline"
    };
  }

  // RefundPayment refunds an already-paid Payment (T12.3). The online path
  // refunds the stored intent reference through
  // port.PaymentProcessor.RefundPayment; the offline path is a
  // Host/Game-Admin action with no processor step.
  //
  // Status codes (gRPC codes, deliberately stated without HTTP statuses
  // alongside them — the wire contract this file defines is gRPC, and
  // grpc-gateway's HTTP mapping is a downstream consequence, not a second
  // contract to keep in sync by hand):
  //   - PERMISSION_DENIED: the actor is not the Booking's Host, the
  //     Registration's Game's Host, or an assigned Game Admin.
  //   - NOT_FOUND: unknown or malformed payment_id (both answer
  //     identically — see app.Service.GetPayment's uuidShape guard).
  //   - FAILED_PRECONDITION: illegal transition — the Payment is already
  //     refunded, or was never paid. Rejected by domain.Payment.Refund()'s
  //     own state machine.
  //   - INVALID_ARGUMENT: the Payment's payable type is out of this RPC's
  //     scope (competition_entry, issue #125; no_show_fee, issue #130).
  //   - INTERNAL: the payment processor failed. The Payment is NOT marked
  //     refunded in that case.
  rpc RefundPayment(RefundPaymentRequest) returns (RefundPaymentResponse) {
    option (google.api.http) = {
      post: "/v1/payments/{payment_id}:refund"
      body: "*"
    };
  }
}
