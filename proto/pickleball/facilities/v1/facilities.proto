syntax = "proto3";

package pickleball.facilities.v1;

import "google/api/annotations.proto";

option go_package = "github.com/nhuthuynh/white-label/internal/gen/pickleball/facilities/v1;facilitiesv1";

// CameraLink mirrors internal/facilities/domain.CameraLink (T7.2). court_id
// is empty for a facility-wide link and set to a specific Court's id for a
// link scoped to that Court only.
message CameraLink {
  string url = 1;
  string court_id = 2;
}

// Facility mirrors internal/facilities/domain.Facility (T7.2).
// camera_consent_attested defaults to false server-side on creation
// regardless of what a client sends — see CreateFacilityRequest's doc
// comment — and only AddCameraLink is gated by it (round-10 design review
// §2b, docs/design/v1-review-round-10-final.md).
message Facility {
  string id = 1;
  string owner_id = 2;
  string name = 3;
  string description = 4;
  string address = 5;
  repeated string photo_urls = 6;
  bool camera_consent_attested = 7;
  repeated CameraLink camera_links = 8;
}

// Court mirrors internal/facilities/domain.Court (T7.2) — the same Court
// booking.domain.Booking reserves via its CourtID (proto/pickleball/
// booking/v1/booking.proto), and pricing_rules prices via its court_id.
message Court {
  string id = 1;
  string facility_id = 2;
  string name = 3;
}

// CreateFacilityRequest deliberately has no camera_consent_attested field:
// domain.NewFacility has no parameter that could set it true on creation
// (T7.2), so there is nothing here for a client to set either — consent is
// always attested as an explicit, separate step (AddCameraLink's
// precondition), never at creation time.
message CreateFacilityRequest {
  // DEPRECATED (T12.7): ignored by the server. The new Facility is owned by
  // the verified bearer token's principal, not by whoever this field names.
  // This one is a *privilege* field, which is why it moved with the
  // actor_user_id fields rather than being left alone: honoring it would let
  // any caller mint a Facility owned by a subject that is not theirs, the
  // same squatting shape T12.9 closes for identity_users one table over.
  // Retained, not deleted, because removing a proto field is a breaking wire
  // change and web/ still sends it until its own follow-up.
  string owner_id = 1 [deprecated = true];
  string name = 2;
  string description = 3;
  string address = 4;
  repeated string photo_urls = 5;
}

message CreateFacilityResponse {
  Facility facility = 1;
}

message GetFacilityRequest {
  string facility_id = 1;
}

// GetFacilityResponse.courts (T8.2) is the read path AddCourt (T7.3) never
// had: every Court belonging to this Facility, so a client no longer has to
// fall back to the always-empty courts list FacilityDetail.vue rendered
// before this. Deliberately a field on the *response*, not on the shared
// Facility message: CreateFacility/ListFacilities/AddCameraLink responses
// all reuse Facility via the same grpcapi.toProto, and none of those
// call sites need (or should pay the extra courts query for) a courts list
// — only the single-facility detail view does. A dedicated
// ListFacilityCourts RPC was considered instead and rejected: it would
// require web/src/composables/useFacilityDetail.ts to orchestrate a second
// network call and DiscoverFacilities.vue to join the two results, whereas
// this shape lets GetFacility's existing single round trip carry the data
// mapToFacilityDetail (web/src/models/facility.ts) already has a `courts`
// field waiting for. See docs/process/t8-sprint-plan.md T8.2.
message GetFacilityResponse {
  Facility facility = 1;
  repeated Court courts = 2;
}

// ListFacilitiesRequest's name_filter is a simple case-insensitive
// substring match (Postgres ILIKE) on Facility.Name — no real geo-search
// (HANDOFF.md T7.3). An empty name_filter returns every Facility.
message ListFacilitiesRequest {
  string name_filter = 1;
}

message ListFacilitiesResponse {
  repeated Facility facilities = 1;
}

// AddCourtRequest adds a Court to an existing Facility. The Postgres
// adapter inserts into the *existing* courts table with facility_id set —
// not a second courts table (HANDOFF.md T7.3 AC 5) — so the returned
// Court.id is immediately usable as a bookings.court_id via
// BookingService, unmodified.
//
// actor_user_id (T7.7) is the caller-claimed identity checked against the
// target Facility's owner_id before the Court is added — a mismatch is
// rejected with a mapped, non-500 status (PermissionDenied), not a silent
// success. As with T5.5's actor_player_id/T6.7's actor_user_id
// precedents, this is a caller-supplied claim, not a verified identity
// (no real authentication exists yet) — see HANDOFF.md's Auth
// cross-cutting item.
message AddCourtRequest {
  string facility_id = 1;
  string name = 2;
  // DEPRECATED (T12.7): ignored by the server. The acting user is now taken
  // from the verified bearer token's principal, never from this field. It is
  // retained, not deleted, because removing a proto field is a breaking wire
  // change and web/ still sends it until its own follow-up; a client that
  // still populates it is neither helped nor harmed.
  string actor_user_id = 3 [deprecated = true];
}

message AddCourtResponse {
  Court court = 1;
}

// AddCameraLinkRequest adds a facility-wide camera link. Rejected with a
// mapped 4xx (not a 500 — see internal/facilities/adapter/grpcapi's
// toStatus) via domain.ErrCameraConsentRequired when the Facility's
// camera_consent_attested is still false (HANDOFF.md T7.3 smoke-test AC),
// or via domain.ErrNotFacilityOwner (T7.7) when actor_user_id does not
// match the Facility's owner_id — see AddCourtRequest.actor_user_id's doc
// comment for the same caveat (caller-claimed identity, not verified).
message AddCameraLinkRequest {
  string facility_id = 1;
  string url = 2;
  // DEPRECATED (T12.7): ignored by the server. The acting user is now taken
  // from the verified bearer token's principal, never from this field. It is
  // retained, not deleted, because removing a proto field is a breaking wire
  // change and web/ still sends it until its own follow-up; a client that
  // still populates it is neither helped nor harmed.
  string actor_user_id = 3 [deprecated = true];
}

message AddCameraLinkResponse {
  Facility facility = 1;
}

// AttestCameraConsentRequest is T8.4's dedicated write path for
// Facility.CameraConsentAttested — deliberately its own RPC, not a field on
// AddCameraLinkRequest, per the round-10 design review's requirement that
// consent not be settable at creation time (cited in T7.2's own ticket
// text): attesting consent and adding a link stay two explicit steps.
// T7.2/T7.3 shipped no RPC that could ever set this to true, so every
// correct client submission of AddCameraLink was rejected with
// ErrCameraConsentRequired until this ticket. actor_user_id follows the
// same caller-claimed-identity convention as AddCourtRequest/
// AddCameraLinkRequest (T7.7) — checked against the target Facility's
// owner_id via domain.Facility.EnsureOwner before consent is ever touched,
// so a non-owner is rejected with a mapped 403 without learning the
// Facility's current consent state.
message AttestCameraConsentRequest {
  string facility_id = 1;
  // DEPRECATED (T12.7): ignored by the server. The acting user is now taken
  // from the verified bearer token's principal, never from this field. It is
  // retained, not deleted, because removing a proto field is a breaking wire
  // change and web/ still sends it until its own follow-up; a client that
  // still populates it is neither helped nor harmed.
  string actor_user_id = 2 [deprecated = true];
}

message AttestCameraConsentResponse {
  Facility facility = 1;
}

// FacilitiesService is the API contract for the Facilities bounded
// context, mirroring BookingService's/PaymentsService's style
// (proto/pickleball/booking/v1, proto/pickleball/payments/v1) — buf
// generates gRPC, a grpc-gateway REST mapping, and OpenAPI from this file.
service FacilitiesService {
  rpc CreateFacility(CreateFacilityRequest) returns (CreateFacilityResponse) {
    option (google.api.http) = {
      post: "/v1/facilities"
      body: "*"
    };
  }

  rpc GetFacility(GetFacilityRequest) returns (GetFacilityResponse) {
    option (google.api.http) = {
      get: "/v1/facilities/{facility_id}"
    };
  }

  rpc ListFacilities(ListFacilitiesRequest) returns (ListFacilitiesResponse) {
    option (google.api.http) = {
      get: "/v1/facilities"
    };
  }

  rpc AddCourt(AddCourtRequest) returns (AddCourtResponse) {
    option (google.api.http) = {
      post: "/v1/facilities/{facility_id}/courts"
      body: "*"
    };
  }

  // AddCameraLink is not one of the four RPCs HANDOFF.md T7.3 names
  // explicitly, but is required to exercise its smoke-test AC ("adding a
  // camera link before consent is attested returns a mapped 4xx"), so it's
  // included here alongside them.
  rpc AddCameraLink(AddCameraLinkRequest) returns (AddCameraLinkResponse) {
    option (google.api.http) = {
      post: "/v1/facilities/{facility_id}/cameraLinks"
      body: "*"
    };
  }

  // AttestCameraConsent is T8.4's dedicated write path for
  // Facility.CameraConsentAttested — see AttestCameraConsentRequest's doc
  // comment for why it's a separate RPC rather than a field folded into
  // AddCameraLinkRequest.
  rpc AttestCameraConsent(AttestCameraConsentRequest) returns (AttestCameraConsentResponse) {
    option (google.api.http) = {
      post: "/v1/facilities/{facility_id}/attestCameraConsent"
      body: "*"
    };
  }
}
